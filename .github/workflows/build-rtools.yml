name: Build Portable Rtools

on:
  workflow_dispatch:
    inputs:
      rtools_version:
        description: 'Rtools version (43, 44, or 45)'
        required: true
        default: '45'
        type: choice
        options:
          - '43'
          - '44'
          - '45'

concurrency:
  group: build-rtools
  cancel-in-progress: false
  queue: max  # keep every pending run (default keeps one and cancels the rest)

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      rtools_version: ${{ github.event.inputs.rtools_version }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: resolve
        run: |
          RT="${{ github.event.inputs.rtools_version }}"
          # aarch64 only when versions.json lists an aarch64 installer
          MATRIX='[{"arch":"x64","runner":"windows-latest"}'
          if jq -e --arg rt "$RT" '.rtools[$rt].aarch64.file' versions.json >/dev/null; then
            MATRIX="${MATRIX},{\"arch\":\"aarch64\",\"runner\":\"windows-11-arm\"}"
          fi
          MATRIX="${MATRIX}]"
          echo "matrix={\"include\":$MATRIX}" >> $GITHUB_OUTPUT
          echo "Building Rtools$RT: $MATRIX"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve Rtools installer filename
        id: rtools-info
        shell: pwsh
        run: |
          $versions = Get-Content versions.json -Raw | ConvertFrom-Json
          $rt = "${{ needs.prepare.outputs.rtools_version }}"
          $arch = "${{ matrix.arch }}"
          $file = if ($arch -eq "aarch64") { $versions.rtools.$rt.aarch64.file } else { $versions.rtools.$rt.x64.file }
          "installer=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache extracted Rtools
        id: cache
        uses: actions/cache@v6
        with:
          path: portable-rtools${{ needs.prepare.outputs.rtools_version }}-win-${{ matrix.arch }}
          key: rtools-${{ steps.rtools-info.outputs.installer }}

      - name: Build portable Rtools
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\build.ps1 -RtoolsOnly -RtoolsVersion "${{ needs.prepare.outputs.rtools_version }}" -Architecture "${{ matrix.arch }}"

      # Same .7z (LZMA2) archive as build.ps1 -RtoolsOnly: the toolchain is
      # too large for a zip under GitHub's 2 GB release asset limit
      - name: Archive from cache
        if: steps.cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $outputName = "portable-rtools${{ needs.prepare.outputs.rtools_version }}-win-${{ matrix.arch }}"
          $archiveFile = "${outputName}.7z"
          if (Test-Path $archiveFile) { Remove-Item $archiveFile }
          $null = & 7z a -t7z -mx=7 -mmt=on $archiveFile $outputName 2>&1
          if ($LASTEXITCODE -ge 2) { throw "7z failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 $archiveFile).Hash.ToLower()
          "${hash}  ${archiveFile}" | Out-File -FilePath "${archiveFile}.sha256" -Encoding ASCII
          Write-Host "Archived from cache: $archiveFile"

      - name: Test portable Rtools
        shell: pwsh
        run: |
          .\tests\run-rtools-tests.ps1 "portable-rtools${{ needs.prepare.outputs.rtools_version }}-win-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: portable-rtools${{ needs.prepare.outputs.rtools_version }}-win-${{ matrix.arch }}
          path: |
            portable-rtools*-win-${{ matrix.arch }}.7z
            portable-rtools*-win-${{ matrix.arch }}.7z.sha256
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: portable-rtools${{ needs.prepare.outputs.rtools_version }}-win-x64
          path: artifacts/

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: portable-rtools${{ needs.prepare.outputs.rtools_version }}-win-aarch64
          path: artifacts/

      - name: Generate release body
        env:
          RT: ${{ needs.prepare.outputs.rtools_version }}
          GH_REPO: ${{ github.repository }}
        run: |
          HAS_ARM64=false
          [ -f "artifacts/portable-rtools${RT}-win-aarch64.7z" ] && HAS_ARM64=true

          X64_SHA=$(cut -d' ' -f1 "artifacts/portable-rtools${RT}-win-x64.7z.sha256" 2>/dev/null || echo "n/a")
          ARM_SHA=$(cut -d' ' -f1 "artifacts/portable-rtools${RT}-win-aarch64.7z.sha256" 2>/dev/null || echo "n/a")
          DL="https://github.com/${GH_REPO}/releases/download/rtools${RT}"

          {
            echo "## Portable Rtools${RT} for Windows"
            echo ""
            echo "Standalone portable Rtools toolchain. Use with portable R or a system R installation for source package compilation."
            echo ""
            echo "### Downloads"
            echo "| Architecture | File | SHA256 |"
            echo "|-------------|------|--------|"
            echo "| Windows x64 | \`portable-rtools${RT}-win-x64.7z\` | \`${X64_SHA}\` |"
            if [ "$HAS_ARM64" = "true" ]; then
              echo "| Windows ARM64 | \`portable-rtools${RT}-win-aarch64.7z\` | \`${ARM_SHA}\` |"
            fi
            echo ""
            echo "### Quick Install"
            echo ""
            echo "\`.7z\`, requires [7-Zip](https://7-zip.org/) (\`winget install 7zip.7zip\`)"
            echo "\`\`\`powershell"
            echo "curl.exe -fSLO ${DL}/portable-rtools${RT}-win-x64.7z"
            echo "& \"\$env:ProgramFiles\\7-Zip\\7z.exe\" x portable-rtools${RT}-win-x64.7z"
            echo "\`\`\`"
            echo ""
            echo "### Usage with R"
            echo ""
            echo "Add the toolchain to R's PATH via \`Renviron.site\` (on ARM64 the toolchain directory is \`aarch64-w64-mingw32.static.posix\`):"
            echo "\`\`\`"
            echo "PATH=\"/path/to/portable-rtools${RT}-win-x64/x86_64-w64-mingw32.static.posix/bin;/path/to/portable-rtools${RT}-win-x64/usr/bin;\${PATH}\""
            echo "\`\`\`"
            echo ""
            echo "Or use the **R + Rtools** bundle which configures this automatically."
          } > release-body.md

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rtools${{ needs.prepare.outputs.rtools_version }}
          name: Rtools${{ needs.prepare.outputs.rtools_version }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: release-body.md
          make_latest: false  # "Latest" stays on the newest R release

  # Regenerate the README download tables once the release is published
  update-readme:
    needs: [prepare, release]
    uses: ./.github/workflows/update-readme.yml
    with:
      tag: rtools${{ needs.prepare.outputs.rtools_version }}
    permissions:
      contents: write
