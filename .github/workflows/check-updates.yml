# Check for new R and Rtools releases on CRAN
#
# Runs daily at 08:00 UTC. Scrapes CRAN and GitHub for:
#   - New R versions (x64 from cloud.r-project.org, aarch64 from the
#     r-devel/windows-arm64 GitHub releases)
#   - Updated Rtools installers (new build numbers)
#   - New Rtools major versions (e.g., Rtools46 appearing on CRAN)
#
# When changes are found:
#   1. Updates versions.json with new versions/filenames
#   2. Commits versions.json and LAST_CHECKED
#   3. Triggers builds for the new R versions / architectures
#      (trigger-builds.sh); each build regenerates the README tables
#      once its release is published
#
# Each upstream source is checked independently: one that cannot be reached
# is skipped and reported (the run ends red) without blocking the others.
# LAST_CHECKED is always updated and committed, so you can verify the cron is
# running without checking Actions logs, and the daily commit keeps GitHub
# from disabling this schedule for inactivity.

name: Check for Updates

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 08:00 UTC
  workflow_dispatch:       # Manual trigger from Actions tab

permissions:
  contents: write   # Push commits (versions.json, README.md, LAST_CHECKED)
  actions: write    # Trigger build workflows for new versions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Save a copy so we can diff after the check to find what's new
      - name: Snapshot current versions
        run: cp versions.json versions-before.json

      # Scrapes CRAN pages, updates versions.json if anything changed,
      # writes LAST_CHECKED summary, sets outputs.changed=true/false and
      # outputs.failed (unreachable sources; empty when all were checked)
      - name: Check for new releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}  # GitHub API for r-devel/windows-arm64
        run: bash check-updates.sh

      # Always commit LAST_CHECKED (proves the cron ran).
      # Include versions.json when it changed. Only this workflow writes these
      # two files, so a rebase over a build's README update cannot conflict.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LAST_CHECKED
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            git add versions.json
          fi
          git diff --staged --quiet && exit 0
          git commit -m "Check updates: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejected, rebasing ($i/3)..."
            git pull --rebase origin main
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1

      # Build only the architectures that changed, so a late ARM64 installer
      # does not rebuild (and re-publish) the existing x64 files
      - name: Trigger builds for new R versions
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash trigger-builds.sh versions-before.json versions.json

      # Runs last, after everything the reachable sources found has been
      # committed and built: the red run (and GitHub's failure email) flags
      # the sources that could not be checked
      - name: Report unreachable sources
        if: always() && steps.check.outputs.failed != ''
        env:
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          {
            echo "## Upstream sources could not be checked"
            echo ""
            echo "$FAILED" | tr ';' '\n' | sed 's/^ */- /'
            echo ""
            echo "Everything else was checked and committed. The next run retries these."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Incomplete check: $FAILED"
          exit 1
